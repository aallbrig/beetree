openapi: 3.0.3
info:
  title: BeeTreeCraft API
  version: 1.0.0
  description: |
    Create, validate, simulate, share and discuss engine-agnostic behavior trees.

    Every endpoint except `/v1/health` and `/v1/openapi.json` needs credentials. Create an API key
    on your profile page and send it as `X-API-Key: btc_...` or `Authorization: Bearer btc_...`.
    A Cognito token from sign-in (`Authorization: Bearer <token>`) also works, and is the only way to
    manage API keys. See https://beetreecraft.com/docs/api/ for setup.
    An MCP server is available at `POST /mcp` and needs the same credentials (see the MCP docs).
  license:
    name: MIT
servers:
  - url: https://api.beetreecraft.com
    description: Production
tags:
  - name: Tools
    description: Stateless validate, simulate, render and generate
  - name: Trees
  - name: Social
  - name: Account
  - name: Forum
  - name: Scenes
  - name: MCP
security:
  - apiKeyAuth: []
  - bearerAuth: []
paths:
  /v1/health:
    get:
      security: []
      summary: Service health
      operationId: health
      tags: [Tools]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
                  version: {type: string}
  /v1/openapi.json:
    get:
      security: []
      summary: This document as JSON
      operationId: getOpenApi
      tags: [Tools]
      responses:
        '200': {description: The OpenAPI document}
  /v1/node-types:
    get:
      summary: Node types, decorators, render formats and engines
      operationId: getNodeTypes
      tags: [Tools]
      responses:
        '200': {description: OK}
  /v1/validate:
    post:
      summary: Validate a spec
      operationId: validateSpec
      tags: [Tools]
      requestBody: {$ref: '#/components/requestBodies/Spec'}
      responses:
        '200':
          description: Validation result (valid or not)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidateResult'}
  /v1/simulate:
    post:
      summary: Dry-run a spec
      operationId: simulateSpec
      tags: [Tools]
      requestBody: {$ref: '#/components/requestBodies/Spec'}
      responses:
        '200':
          description: Execution trace
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimulateResult'}
        '422': {$ref: '#/components/responses/Error'}
  /v1/simulate/step:
    post:
      summary: Step through a simulation one leaf at a time
      description: >
        Stateless. Send the spec and the answers given so far (empty to start).
        While done is false, pending names the leaf that needs a status; send
        its status appended to answers on the next call. When done is true the
        response carries the final status and trace.
      operationId: simulateStep
      tags: [Tools]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spec]
              properties:
                spec: {type: string, description: Tree spec as YAML}
                answers:
                  type: array
                  items: {type: string, enum: [SUCCESS, FAILURE, RUNNING]}
      responses:
        '200':
          description: Pending leaf, or the final result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StepResult'}
        '422': {$ref: '#/components/responses/Error'}
  /v1/render:
    post:
      summary: Render a spec as ascii, sigil, mermaid or dot
      operationId: renderSpec
      tags: [Tools]
      requestBody: {$ref: '#/components/requestBodies/Spec'}
      responses:
        '200': {description: Rendered diagram}
        '422': {$ref: '#/components/responses/Error'}
  /v1/generate:
    post:
      summary: Generate engine code (unity, unreal, godot)
      operationId: generateCode
      tags: [Tools]
      requestBody: {$ref: '#/components/requestBodies/Spec'}
      responses:
        '200': {description: Generated files}
        '422': {$ref: '#/components/responses/Error'}
  /v1/public/trees:
    get:
      summary: Visitor showcase of public trees (no credentials)
      operationId: publicTrees
      tags: [Trees]
      security: []
      description: A snapshot of public trees refreshed daily, without spec bodies. Signed-in users and API clients should use GET /v1/trees for live results.
      parameters:
        - {name: q, in: query, schema: {type: string}, description: 'Match name, description or tags'}
        - {name: sort, in: query, schema: {type: string, enum: [recent, popular]}}
      responses:
        '200':
          description: The snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Tree'}
                  generatedAt: {type: string, format: date-time}
                  note: {type: string}
  /v1/trees:
    get:
      summary: List public trees
      operationId: listTrees
      tags: [Trees]
      parameters:
        - {name: q, in: query, schema: {type: string}, description: 'Match name, description or tags'}
        - {name: tag, in: query, schema: {type: string}}
        - {name: sort, in: query, schema: {type: string, enum: [recent, popular]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200':
          description: Trees (without spec bodies)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Tree'}
    post:
      summary: Create a tree
      operationId: createTree
      tags: [Trees]
      security: [{bearerAuth: []}, {apiKeyAuth: []}]
      requestBody: {$ref: '#/components/requestBodies/Tree'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tree'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /v1/trees/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      summary: Get a tree with its spec
      operationId: getTree
      tags: [Trees]
      responses:
        '200':
          description: The tree
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tree'}
        '404': {$ref: '#/components/responses/Error'}
    put:
      summary: Replace a tree you own
      operationId: updateTree
      tags: [Trees]
      security: [{bearerAuth: []}, {apiKeyAuth: []}]
      requestBody: {$ref: '#/components/requestBodies/Tree'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tree'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    delete:
      summary: Delete a tree you own
      operationId: deleteTree
      tags: [Trees]
      security: [{bearerAuth: []}, {apiKeyAuth: []}]
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /v1/trees/{id}/like:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      summary: Like a tree (idempotent)
      operationId: likeTree
      tags: [Social]
      security: [{bearerAuth: []}, {apiKeyAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/Like'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      summary: Remove your like
      operationId: unlikeTree
      tags: [Social]
      security: [{bearerAuth: []}, {apiKeyAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/Like'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /v1/trees/{id}/comments:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      summary: List comments
      operationId: listComments
      tags: [Social]
      responses:
        '200':
          description: Comments, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Comment'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      summary: Add a comment
      operationId: addComment
      tags: [Social]
      security: [{bearerAuth: []}, {apiKeyAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string, maxLength: 2000}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Comment'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /v1/trees/{id}/comments/{commentId}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
      - {name: commentId, in: path, required: true, schema: {type: string}}
    delete:
      summary: Delete a comment (author or tree owner)
      operationId: deleteComment
      tags: [Social]
      security: [{bearerAuth: []}, {apiKeyAuth: []}]
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /v1/me:
    get:
      summary: Your profile
      operationId: getMe
      tags: [Account]
      security: [{bearerAuth: []}, {apiKeyAuth: []}]
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        '401': {$ref: '#/components/responses/Error'}
    put:
      summary: Update your profile
      operationId: updateMe
      tags: [Account]
      security: [{bearerAuth: []}, {apiKeyAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName: {type: string, pattern: '^[A-Za-z0-9_-]{3,32}$'}
                bio: {type: string, maxLength: 500}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /v1/me/trees:
    get:
      summary: Your trees, public and private
      operationId: myTrees
      tags: [Account]
      security: [{bearerAuth: []}, {apiKeyAuth: []}]
      responses:
        '200': {description: Trees without spec bodies}
        '401': {$ref: '#/components/responses/Error'}
  /v1/me/stats:
    get:
      summary: Your engagement stats
      operationId: myStats
      tags: [Account]
      security: [{bearerAuth: []}, {apiKeyAuth: []}]
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Stats'}
        '401': {$ref: '#/components/responses/Error'}
  /v1/users/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      summary: A user's public profile and public trees
      operationId: getUser
      tags: [Account]
      responses:
        '200': {description: Profile and trees}
        '404': {$ref: '#/components/responses/Error'}
  /v1/forum/threads:
    get:
      summary: List forum threads, most recently active first
      operationId: listThreads
      tags: [Forum]
      responses:
        '200': {description: Threads}
    post:
      summary: Start a thread
      operationId: createThread
      tags: [Forum]
      security: [{bearerAuth: []}, {apiKeyAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title: {type: string, maxLength: 120}
                body: {type: string, maxLength: 5000}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Thread'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /v1/forum/threads/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      summary: A thread and its posts
      operationId: getThread
      tags: [Forum]
      responses:
        '200': {description: Thread and posts}
        '404': {$ref: '#/components/responses/Error'}
  /v1/forum/threads/{id}/posts:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      summary: Reply to a thread
      operationId: addPost
      tags: [Forum]
      security: [{bearerAuth: []}, {apiKeyAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string, maxLength: 5000}
      responses:
        '201': {description: Created}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /v1/forum/threads/{id}/report:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      summary: Report a thread, or one of its posts, for moderator review
      operationId: reportThread
      tags: [Forum]
      security: [{bearerAuth: []}, {apiKeyAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                postId: {type: string, description: Omit to report the thread itself}
                reason: {type: string, maxLength: 500}
      responses:
        '201': {description: Reported}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /v1/forum/reports:
    get:
      summary: Most recent reports across all threads, newest first (moderators only)
      operationId: listRecentReports
      tags: [Forum]
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Reports}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /v1/forum/threads/{id}/reports:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      summary: Reports filed against a thread and its posts (moderators only)
      operationId: listReports
      tags: [Forum]
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Reports}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /v1/scenes:
    get:
      summary: Your saved 3D scenes
      operationId: listScenes
      tags: [Scenes]
      security: [{bearerAuth: []}, {apiKeyAuth: []}]
      responses:
        '200': {description: Scenes}
        '401': {$ref: '#/components/responses/Error'}
    post:
      summary: Save a scene
      operationId: createScene
      tags: [Scenes]
      security: [{bearerAuth: []}, {apiKeyAuth: []}]
      requestBody: {$ref: '#/components/requestBodies/Scene'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Scene'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /v1/scenes/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      summary: Get a scene (public, or yours)
      operationId: getScene
      tags: [Scenes]
      responses:
        '200':
          description: The scene
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Scene'}
        '404': {$ref: '#/components/responses/Error'}
    put:
      summary: Replace a scene you own
      operationId: updateScene
      tags: [Scenes]
      security: [{bearerAuth: []}, {apiKeyAuth: []}]
      requestBody: {$ref: '#/components/requestBodies/Scene'}
      responses:
        '200': {description: Updated}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      summary: Delete a scene you own
      operationId: deleteScene
      tags: [Scenes]
      security: [{bearerAuth: []}, {apiKeyAuth: []}]
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /v1/keys:
    get:
      summary: List your API keys
      operationId: listKeys
      tags: [Account]
      description: Needs a signed-in session. Never returns key secrets.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Your keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/APIKeyInfo'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      summary: Create an API key
      operationId: createKey
      tags: [Account]
      description: Needs a signed-in session. The secret is returned once; only its hash is stored. Up to 5 keys per account.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 60}
      responses:
        '201':
          description: Created; copy the key now
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIKeyInfo'
                  - type: object
                    properties:
                      key: {type: string, description: 'The secret, shown once'}
                      note: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /v1/keys/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      summary: Revoke an API key
      operationId: deleteKey
      tags: [Account]
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Revoked}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /mcp:
    post:
      summary: Model Context Protocol endpoint (JSON-RPC 2.0)
      operationId: mcp
      tags: [MCP]
      description: Streamable HTTP transport, JSON responses. Supports initialize, ping, tools/list and tools/call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc: {type: string, enum: ['2.0']}
                id: {}
                method: {type: string, example: tools/list}
                params: {type: object}
      responses:
        '200': {description: JSON-RPC response}
        '202': {description: Notification accepted}
    get:
      summary: Not supported; use POST
      operationId: mcpGet
      tags: [MCP]
      responses:
        '405': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Cognito token from sign-in, or an API key (btc_...) sent as a bearer token.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string}
  requestBodies:
    Spec:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [spec]
            properties:
              spec: {type: string, description: .beetree.yaml text}
              format: {type: string, enum: [ascii, sigil, mermaid, dot]}
              engine: {type: string, enum: [unity, unreal, godot]}
              overrides:
                type: object
                additionalProperties: {type: string, enum: [SUCCESS, FAILURE, RUNNING]}
    Tree:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [spec]
            properties:
              name: {type: string, maxLength: 80}
              description: {type: string, maxLength: 500}
              visibility: {type: string, enum: [public, private]}
              tags: {type: array, items: {type: string}}
              spec: {type: string}
    Scene:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: {type: string}
              visibility: {type: string, enum: [public, private]}
              agents:
                type: array
                maxItems: 24
                items: {$ref: '#/components/schemas/SceneAgent'}
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Like:
      description: Like state
      content:
        application/json:
          schema:
            type: object
            properties:
              liked: {type: boolean}
              likeCount: {type: integer}
  schemas:
    APIKeyInfo:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        prefix: {type: string, description: 'First characters of the key, for recognition'}
        createdAt: {type: string, format: date-time}
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: {type: string}
            message: {type: string}
    ValidateResult:
      type: object
      properties:
        valid: {type: boolean}
        errors: {type: array, items: {type: string}}
        nodeCount: {type: integer}
    StepResult:
      type: object
      required: [done, answered, root, steps]
      properties:
        done: {type: boolean}
        answered: {type: integer}
        root: {type: string}
        pending:
          type: object
          properties:
            node: {type: string}
            type: {type: string}
        status: {type: string, enum: [SUCCESS, FAILURE, RUNNING]}
        trace: {type: string}
        steps:
          type: array
          items:
            type: object
            properties:
              depth: {type: integer}
              node: {type: string}
              type: {type: string}
              event: {type: string}
              status: {type: string}
    SimulateResult:
      type: object
      properties:
        root: {type: string}
        status: {type: string, enum: [SUCCESS, FAILURE, RUNNING]}
        trace: {type: string}
        steps:
          type: array
          items:
            type: object
            properties:
              depth: {type: integer}
              node: {type: string}
              type: {type: string}
              event: {type: string}
              status: {type: string}
    Tree:
      type: object
      properties:
        id: {type: string}
        ownerId: {type: string}
        ownerName: {type: string}
        name: {type: string}
        description: {type: string}
        visibility: {type: string, enum: [public, private]}
        tags: {type: array, items: {type: string}}
        spec: {type: string}
        likeCount: {type: integer}
        commentCount: {type: integer}
        likedByMe: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Comment:
      type: object
      properties:
        id: {type: string}
        treeId: {type: string}
        authorId: {type: string}
        author: {type: string}
        body: {type: string}
        createdAt: {type: string, format: date-time}
    Profile:
      type: object
      properties:
        userId: {type: string}
        displayName: {type: string}
        bio: {type: string}
        email: {type: string}
        moderator: {type: boolean, description: 'Present and true on GET /v1/me when the caller may review reports'}
        createdAt: {type: string, format: date-time}
    Stats:
      type: object
      properties:
        trees: {type: integer}
        publicTrees: {type: integer}
        likes: {type: integer}
        comments: {type: integer}
        forumThreads: {type: integer}
        forumPosts: {type: integer}
        scenes: {type: integer}
    Thread:
      type: object
      properties:
        id: {type: string}
        title: {type: string}
        author: {type: string}
        body: {type: string}
        postCount: {type: integer}
        createdAt: {type: string, format: date-time}
