name: Release deploy

# Cutting a release (task release -- vX.Y.Z) publishes a GitHub release, which
# runs every CI gate again and then deploys the backend and the site to production.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> AWS, no stored keys
    env:
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.157.0'
          extended: true
      - name: Install SAM CLI
        run: pipx install aws-sam-cli
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Deploy backend
        # DNS and www must stay true: false removes the apex/www records and the certificate
        run: task deploy:backend DNS=true WWW=true
      - name: Deploy site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "${{ github.event.release.tag_name }}" --repo "${{ github.repository }}" \
            --pattern 'beetree_*' --dir "$RUNNER_TEMP/assets"
          scripts/downloads_layout.sh "${{ github.event.release.tag_name }}" "$RUNNER_TEMP/assets" "$RUNNER_TEMP/dl"
          DOWNLOADS_DIR="$RUNNER_TEMP/dl" task deploy:site
      - name: Smoke test production
        run: task smoke
