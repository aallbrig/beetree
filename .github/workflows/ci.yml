name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: cli
          args: --help
      - name: Install tmuxinator
        run: sudo apt-get update && sudo apt-get install -y tmux tmuxinator
      - name: Run every quality gate
        run: task ci
