run:
  timeout: 5m
linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gofmt
    - misspell
    - bodyclose
    - gosec
linters-settings:
  gosec:
    excludes:
      - G306 # CLI writes user-facing spec files that should be world-readable

issues:
  exclude-rules:
    - path: _test\.go
      linters: [gosec]
