---
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo 0.0.0

tasks:
  default:
    cmds:
      - task --list
    silent: true

  setup:
    desc: One-time install of tooling deps
    cmds:
      - pre-commit install
      - cd cli && go mod download
      - cd web && npm ci

  ci:
    desc: Run every quality gate. No live services required.
    cmds:
      - task: format:check
      - task: lint
      - task: test
      - task: build
      - task: dev:check
      - task: docs:check
      - task: site:check

  # ---- lint / format -------------------------------------------------------
  lint:
    desc: All linting
    cmds:
      - task: lint:go
      - task: lint:web
      - task: lint:shell
      - task: lint:secrets
      - task: lint:infra

  lint:go:
    desc: go vet + golangci-lint
    dir: cli
    cmds:
      - go vet ./...
      - golangci-lint run ./...

  lint:secrets:
    desc: Scan the working tree for secrets
    cmds:
      - gitleaks detect --no-banner --redact

  lint:web:
    desc: Type-check and ESLint (strict, no escape hatches) the web app
    dir: web
    cmds:
      - npx tsc --noEmit
      - npx eslint src

  lint:infra:
    desc: Lint the SAM/CloudFormation template
    cmds:
      - sam validate --lint -t infra/template.yaml --region us-east-1

  lint:shell:
    desc: Shell script syntax check
    cmds:
      - bash -n scripts/*.sh

  format:
    desc: All formatting
    cmds:
      - cd cli && gofmt -w .
      - cd web && npx prettier --write src

  format:check:
    desc: Fail if anything needs formatting
    cmds:
      - |
        out=$(cd cli && gofmt -l .)
        if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - cd web && npx prettier --check src

  # ---- test ---------------------------------------------------------------
  test:
    desc: All tests
    cmds:
      - task: test:go
      - task: test:web

  test:go:
    desc: Go tests with race detector
    dir: cli
    cmds:
      - go test -race -count=1 ./...

  # ---- build --------------------------------------------------------------
  build:
    desc: Build artifacts
    cmds:
      - task: build:cli
      - task: build:lambda
      - task: build:web

  build:cli:
    desc: Build the beetree CLI to bin/beetree
    dir: cli
    cmds:
      - go build -ldflags "-X github.com/aallbrig/beetree-cli/cmd.Version={{.VERSION}}" -o ../bin/beetree .

  build:web:
    desc: Build the web app into website/static/app
    dir: web
    cmds:
      - npm run build

  build:lambda:
    desc: Cross-compile the API and pre-signup Lambdas (linux/arm64) into infra/build
    dir: cli
    env:
      GOOS: linux
      GOARCH: arm64
      CGO_ENABLED: '0'
    cmds:
      - go build -tags lambda.norpc -ldflags "-s -w -X main.version={{.VERSION}}" -o ../infra/build/api/bootstrap ./lambda/api
      - go build -tags lambda.norpc -ldflags "-s -w" -o ../infra/build/presignup/bootstrap ./lambda/presignup

  # ---- dev session --------------------------------------------------------
  dev:
    desc: Start the tmuxinator session (attach if already running)
    interactive: true
    cmds:
      - scripts/dev_session.sh up

  dev:attach:
    desc: Re-attach to the running session
    interactive: true
    cmds:
      - scripts/dev_session.sh attach

  dev:recycle:
    desc: Kill and restart the session
    interactive: true
    cmds:
      - scripts/dev_session.sh recycle

  dev:check:
    desc: Validate the tmuxinator config without starting anything
    cmds:
      - tmuxinator debug --project-config .tmuxinator/beetree.yml >/dev/null

  # ---- deploy -------------------------------------------------------------
  deploy:backend:
    desc: Build Lambdas and deploy the SAM stack (us-east-1). Pass DNS=true to cut over the apex; WWW=true to include www.
    deps: [build:lambda]
    vars:
      DNS: '{{default "false" .DNS}}'
      WWW: '{{default "false" .WWW}}'
    cmds:
      - |
        sam deploy -t infra/template.yaml --stack-name beetreecraft --region us-east-1 \
          --resolve-s3 --capabilities CAPABILITY_IAM --no-confirm-changeset --no-fail-on-empty-changeset \
          --parameter-overrides ManageSiteDns={{.DNS}} IncludeWww={{.WWW}}

  deploy:outputs:
    desc: Print stack outputs as JSON
    cmds:
      - aws cloudformation describe-stacks --stack-name beetreecraft --region us-east-1 --query 'Stacks[0].Outputs' --output json

  test:web:
    desc: Vitest unit tests for the web app
    dir: web
    cmds:
      - npx vitest run

  smoke:
    desc: End-to-end test of the deployed stack (creates and removes a throwaway user)
    dir: cli
    cmds:
      - go test -tags smoke -count=1 -v ./smoke/

  test:dynamo:
    desc: Run the Store contract test against a throwaway DynamoDB table (needs AWS credentials)
    cmds:
      - scripts/test_dynamo.sh

  # ---- site ---------------------------------------------------------------
  docs:cli:
    desc: Regenerate the CLI reference page from the binary
    deps: [build:cli]
    cmds:
      - bin/beetree docs -o website/content/docs/cli-reference.md

  docs:check:
    desc: Fail if the generated CLI reference is stale
    deps: [build:cli]
    cmds:
      - |
        bin/beetree docs -o /tmp/beetree-cli-reference.md
        diff -u website/content/docs/cli-reference.md /tmp/beetree-cli-reference.md || { echo "run 'task docs:cli'"; exit 1; }

  site:vendor:
    desc: Copy Swagger UI assets into the Hugo static dir (generated, not committed)
    cmds:
      - mkdir -p website/static/vendor/swagger
      - cp web/node_modules/swagger-ui-dist/swagger-ui-bundle.js web/node_modules/swagger-ui-dist/swagger-ui.css website/static/vendor/swagger/

  site:check:
    desc: Build the site and fail on broken internal links or missing pages
    deps: [site:build]
    cmds:
      - scripts/check_site.sh

  site:dev:
    desc: Start Hugo dev server
    deps: [site:vendor]
    dir: website
    cmds:
      - hugo server

  site:build:
    desc: Build the web app and the Hugo site into website/public
    deps: [build:web, site:vendor]
    dir: website
    cmds:
      - hugo --minify --gc

  web:dev:
    desc: Run the Vite dev server against the deployed API (writes web/public/config.json)
    dir: web
    cmds:
      - |
        out() { aws cloudformation describe-stacks --stack-name beetreecraft --region us-east-1 --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
        echo "{\"apiUrl\":\"$(out ApiUrl)\",\"region\":\"us-east-1\",\"clientId\":\"$(out UserPoolClientId)\",\"userPoolId\":\"$(out UserPoolId)\"}" > public/config.json
      - npx vite

  deploy:site:
    desc: Build the site and publish it to S3 + CloudFront
    deps: [site:build]
    cmds:
      - scripts/deploy_site.sh

  deploy:
    desc: Deploy backend then site
    cmds:
      - task: deploy:backend
      - task: deploy:site

  # ---- PRs ----------------------------------------------------------------
  pr:merge:
    desc: "Wait for PR CI, then merge (task pr:merge -- N)"
    cmds:
      - gh pr checks {{.CLI_ARGS}} --watch --fail-fast && gh pr merge {{.CLI_ARGS}} --merge
