# Curated behavior tree resources. Add entries with the find-resources skill; every entry is scored
# against .claude/skills/find-resources/RUBRIC.md (max 14, include at 9 or more).
items:
  - title: "Behavior Trees in Robotics and AI: An Introduction"
    url: "https://arxiv.org/abs/1709.00084"
    kind: Book
    year: "2018"
    author: "Michele Colledanchise and Petter Ögren"
    summary: "The standard introduction: node types, formal semantics, and a comparison with state machines and decision trees. Free PDF on arXiv."
    score: 14
  - title: "Behavior tree (Grokipedia)"
    url: "https://grokipedia.com/page/Behavior_tree"
    kind: Article
    summary: "A broad overview of behavior trees and their history in games and robotics; good for orientation before the book."
    score: 9
  - title: "Behavior Selection Algorithms: An Overview"
    url: "http://www.gameaipro.com/GameAIPro/GameAIPro_Chapter04_Behavior_Selection_Algorithms.pdf"
    kind: Chapter
    year: "2014"
    summary: "Game AI Pro chapter 4. Compares ways to choose what an agent does next, including behavior trees, and when each fits."
    score: 13
  - title: "The Behavior Tree Starter Kit"
    url: "http://www.gameaipro.com/GameAIPro/GameAIPro_Chapter06_The_Behavior_Tree_Starter_Kit.pdf"
    kind: Chapter
    year: "2014"
    summary: "Game AI Pro chapter 6. A practical walk through building a behavior tree runtime from scratch."
    score: 13
  - title: "Real-World Behavior Trees in Script"
    url: "http://www.gameaipro.com/GameAIPro/GameAIPro_Chapter07_Real-World_Behavior_Trees_in_Script.pdf"
    kind: Chapter
    year: "2014"
    summary: "Game AI Pro chapter 7. Authoring behavior trees in a scripting language, with lessons from shipped games."
    score: 12
  - title: "Simulating Behavior Trees: A Behavior Tree / Planner Hybrid Approach"
    url: "http://www.gameaipro.com/GameAIPro/GameAIPro_Chapter08_Simulating_Behavior_Trees.pdf"
    kind: Chapter
    year: "2014"
    summary: "Game AI Pro chapter 8. Combines behavior trees with planning by simulating tree execution ahead of time."
    score: 12
  - title: "Building Utility Decisions into Your Existing Behavior Tree"
    url: "http://www.gameaipro.com/GameAIPro/GameAIPro_Chapter10_Building_Utility_Decisions_into_Your_Existing_Behavior_Tree.pdf"
    kind: Chapter
    year: "2014"
    summary: "Game AI Pro chapter 10. Adds utility scoring to a behavior tree without throwing the tree away."
    score: 12
  - title: "Building a Risk-Free Environment to Enhance Prototyping: Hinted-Execution Behavior Trees"
    url: "http://www.gameaipro.com/GameAIPro2/GameAIPro2_Chapter10_Building_a_Risk-Free_Environment_to_Enhance_Prototyping.pdf"
    kind: Chapter
    year: "2015"
    summary: "Game AI Pro 2 chapter 10. Prototyping behavior safely with hinted execution."
    score: 11
  - title: "Overcoming Pitfalls in Behavior Tree Design"
    url: "http://www.gameaipro.com/GameAIPro3/GameAIPro3_Chapter09_Overcoming_Pitfalls_in_Behavior_Tree_Design.pdf"
    kind: Chapter
    year: "2017"
    summary: "Game AI Pro 3 chapter 9. Common design mistakes in behavior trees and how to avoid them."
    score: 12
  - title: "Template Tricks for Data-Driven Behavior Trees"
    url: "http://www.gameaipro.com/GameAIProOnlineEdition2021/GameAIProOnlineEdition2021_Chapter13_Template_Tricks_for_Data-Driven_Behavior_Trees.pdf"
    kind: Chapter
    year: "2021"
    summary: "Game AI Pro Online Edition 2021, chapter 13. Data-driven trees and template techniques for reuse."
    score: 11
  - title: "Handling Concurrency in Behavior Trees"
    url: "https://arxiv.org/abs/2110.11813"
    kind: Paper
    year: "2021"
    author: "Michele Colledanchise and Lorenzo Natale"
    summary: "Shows why the parallel node gives unpredictable results when children act on shared resources, and introduces two new node types that make concurrent behavior predictable. Backed by simulation experiments, a real-robot test and open-source code."
    score: 14
  - title: "A Survey of Behavior Trees in Robotics and AI"
    url: "https://arxiv.org/abs/2005.05842"
    kind: Paper
    year: "2020"
    author: "Matteo Iovino, Edvards Scukins, Jonathan Styrud, Petter Ögren and Christian Smith"
    summary: "Surveys behavior tree research by method, application area and contribution, from game AI to manipulation and drones, and ends with open research challenges. A good map of the field after the introductory book."
    score: 12
  - title: "Verifying Safety of Behaviour Trees in Event-B"
    url: "https://arxiv.org/abs/2209.14045"
    kind: Paper
    year: "2022"
    author: "Matteo Tadiello and Elena Troubitsyna"
    summary: "Gives a formal specification of behavior trees and a method for proving invariants of an existing tree, so safety requirements can be checked before a robot runs it. Aimed at keeping the formalization simple enough to test specific tree instances."
    score: 12
  - title: "Extending Behavior Trees"
    url: "https://www.gamedeveloper.com/business/extending-behavior-trees"
    kind: Talk
    year: "2017"
    author: "Ben Weber"
    summary: "A write-up of a GDC 2017 AI Summit talk. Covers extra node types such as spawn goal and success test, authoring patterns such as daemon behaviors, message passing and behavior locking, and ways to connect a tree to external planners, with examples from a StarCraft bot."
    score: 9
  - title: "Behavior trees for AI: How they work"
    url: "https://www.gamedeveloper.com/programming/behavior-trees-for-ai-how-they-work"
    kind: Article
    year: "2014"
    author: "Chris Simpson"
    summary: "A long practical walkthrough of node types, return statuses and shared context, with worked examples including item acquisition from Project Zomboid and stack-based utility nodes."
    score: 11
  - title: "BehaviorTree.CPP: Behavior Tree basics"
    url: "https://www.behaviortree.dev/docs/learn-the-basics/BT_basics"
    kind: Tool
    summary: "Official documentation for the C++ library used widely in ROS 2. The basics page explains ticks, return states, Sequence, Fallback and Decorator nodes with a runnable fetch-me-a-beer example; a good bridge from theory to a real engine."
    score: 13
  - title: "LimboAI: Creating behavior trees"
    url: "https://limboai.readthedocs.io/en/stable/behavior-trees/create-tree.html"
    kind: Tool
    summary: "Documentation for the Godot behavior tree plugin: adding a BTPlayer, authoring a tree in the editor and debugging a live tree with the blackboard inspector. Useful for Godot users exporting from BeeTreeCraft."
    score: 9
