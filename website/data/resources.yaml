# Curated behavior tree resources. Add entries with the find-resources skill; every entry is scored
# against .claude/skills/find-resources/RUBRIC.md (max 14, include at 9 or more).
items:
  - title: "Behavior Trees in Robotics and AI: An Introduction"
    url: "https://arxiv.org/abs/1709.00084"
    kind: Book
    year: "2018"
    author: "Michele Colledanchise and Petter Ögren"
    summary: "The standard introduction: node types, formal semantics, and a comparison with state machines and decision trees. Free PDF on arXiv."
    score: 14
  - title: "Behavior tree (Grokipedia)"
    url: "https://grokipedia.com/page/Behavior_tree"
    kind: Article
    summary: "A broad overview of behavior trees and their history in games and robotics; good for orientation before the book."
    score: 9
  - title: "Behavior Selection Algorithms: An Overview"
    url: "http://www.gameaipro.com/GameAIPro/GameAIPro_Chapter04_Behavior_Selection_Algorithms.pdf"
    kind: Chapter
    year: "2014"
    summary: "Game AI Pro chapter 4. Compares ways to choose what an agent does next, including behavior trees, and when each fits."
    score: 13
  - title: "The Behavior Tree Starter Kit"
    url: "http://www.gameaipro.com/GameAIPro/GameAIPro_Chapter06_The_Behavior_Tree_Starter_Kit.pdf"
    kind: Chapter
    year: "2014"
    summary: "Game AI Pro chapter 6. A practical walk through building a behavior tree runtime from scratch."
    score: 13
  - title: "Real-World Behavior Trees in Script"
    url: "http://www.gameaipro.com/GameAIPro/GameAIPro_Chapter07_Real-World_Behavior_Trees_in_Script.pdf"
    kind: Chapter
    year: "2014"
    summary: "Game AI Pro chapter 7. Authoring behavior trees in a scripting language, with lessons from shipped games."
    score: 12
  - title: "Simulating Behavior Trees: A Behavior Tree / Planner Hybrid Approach"
    url: "http://www.gameaipro.com/GameAIPro/GameAIPro_Chapter08_Simulating_Behavior_Trees.pdf"
    kind: Chapter
    year: "2014"
    summary: "Game AI Pro chapter 8. Combines behavior trees with planning by simulating tree execution ahead of time."
    score: 12
  - title: "Building Utility Decisions into Your Existing Behavior Tree"
    url: "http://www.gameaipro.com/GameAIPro/GameAIPro_Chapter10_Building_Utility_Decisions_into_Your_Existing_Behavior_Tree.pdf"
    kind: Chapter
    year: "2014"
    summary: "Game AI Pro chapter 10. Adds utility scoring to a behavior tree without throwing the tree away."
    score: 12
  - title: "Building a Risk-Free Environment to Enhance Prototyping: Hinted-Execution Behavior Trees"
    url: "http://www.gameaipro.com/GameAIPro2/GameAIPro2_Chapter10_Building_a_Risk-Free_Environment_to_Enhance_Prototyping.pdf"
    kind: Chapter
    year: "2015"
    summary: "Game AI Pro 2 chapter 10. Prototyping behavior safely with hinted execution."
    score: 11
  - title: "Overcoming Pitfalls in Behavior Tree Design"
    url: "http://www.gameaipro.com/GameAIPro3/GameAIPro3_Chapter09_Overcoming_Pitfalls_in_Behavior_Tree_Design.pdf"
    kind: Chapter
    year: "2017"
    summary: "Game AI Pro 3 chapter 9. Common design mistakes in behavior trees and how to avoid them."
    score: 12
  - title: "Template Tricks for Data-Driven Behavior Trees"
    url: "http://www.gameaipro.com/GameAIProOnlineEdition2021/GameAIProOnlineEdition2021_Chapter13_Template_Tricks_for_Data-Driven_Behavior_Trees.pdf"
    kind: Chapter
    year: "2021"
    summary: "Game AI Pro Online Edition 2021, chapter 13. Data-driven trees and template techniques for reuse."
    score: 11
  - title: "Handling Concurrency in Behavior Trees"
    url: "https://arxiv.org/abs/2110.11813"
    kind: Paper
    year: "2021"
    author: "Michele Colledanchise and Lorenzo Natale"
    summary: "Shows why the parallel node gives unpredictable results when children act on shared resources, and introduces two new node types that make concurrent behavior predictable. Backed by simulation experiments, a real-robot test and open-source code."
    score: 14
  - title: "A Survey of Behavior Trees in Robotics and AI"
    url: "https://arxiv.org/abs/2005.05842"
    kind: Paper
    year: "2020"
    author: "Matteo Iovino, Edvards Scukins, Jonathan Styrud, Petter Ögren and Christian Smith"
    summary: "Surveys behavior tree research by method, application area and contribution, from game AI to manipulation and drones, and ends with open research challenges. A good map of the field after the introductory book."
    score: 12
  - title: "Verifying Safety of Behaviour Trees in Event-B"
    url: "https://arxiv.org/abs/2209.14045"
    kind: Paper
    year: "2022"
    author: "Matteo Tadiello and Elena Troubitsyna"
    summary: "Gives a formal specification of behavior trees and a method for proving invariants of an existing tree, so safety requirements can be checked before a robot runs it. Aimed at keeping the formalization simple enough to test specific tree instances."
    score: 12
  - title: "Extending Behavior Trees"
    url: "https://www.gamedeveloper.com/business/extending-behavior-trees"
    kind: Talk
    year: "2017"
    author: "Ben Weber"
    summary: "A write-up of a GDC 2017 AI Summit talk. Covers extra node types such as spawn goal and success test, authoring patterns such as daemon behaviors, message passing and behavior locking, and ways to connect a tree to external planners, with examples from a StarCraft bot."
    score: 9
  - title: "Behavior trees for AI: How they work"
    url: "https://www.gamedeveloper.com/programming/behavior-trees-for-ai-how-they-work"
    kind: Article
    year: "2014"
    author: "Chris Simpson"
    summary: "A long practical walkthrough of node types, return statuses and shared context, with worked examples including item acquisition from Project Zomboid and stack-based utility nodes."
    score: 11
  - title: "BehaviorTree.CPP: Behavior Tree basics"
    url: "https://www.behaviortree.dev/docs/learn-the-basics/BT_basics"
    kind: Tool
    summary: "Official documentation for the C++ library used widely in ROS 2. The basics page explains ticks, return states, Sequence, Fallback and Decorator nodes with a runnable fetch-me-a-beer example; a good bridge from theory to a real engine."
    score: 13
  - title: "LimboAI: Creating behavior trees"
    url: "https://limboai.readthedocs.io/en/stable/behavior-trees/create-tree.html"
    kind: Tool
    summary: "Documentation for the Godot behavior tree plugin: adding a BTPlayer, authoring a tree in the editor and debugging a live tree with the blackboard inspector. Useful for Godot users exporting from BeeTreeCraft."
    score: 9
  - title: "Behavior Tree in Unreal Engine: Overview"
    url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/behavior-tree-in-unreal-engine---overview"
    kind: Tool
    summary: "Epic's official overview of Unreal's event-driven behavior trees. Explains why conditions live in decorators, how Services refresh blackboard data, and how Simple Parallel and Observer Aborts replace general parallel nodes, with a cat-and-mouse example. Essential for anyone exporting to Unreal."
    score: 12
  - title: "Handling Complexity in the Halo 2 AI"
    url: "https://gamedeveloper.com/programming/gdc-2005-proceeding-handling-complexity-in-the-i-halo-2-i-ai"
    kind: Article
    year: "2005"
    author: "Damian Isla"
    summary: "The GDC 2005 write-up that popularised behavior trees in games. Describes Halo 2's behavior DAG and how impulses, stimulus behaviors, tagging and orders keep a large AI manageable, with concrete examples such as entering a vehicle or fleeing when a leader dies."
    score: 11
  - title: "AI Arborist: Proper Cultivation and Care for Your Behavior Trees"
    url: "https://gamedeveloper.com/design/video-cultivating-and-caring-for-great-ai-behavior-trees"
    kind: Talk
    year: "2017"
    author: "Bobby Anguelov, Mika Vehkala and Ben Weber"
    summary: "A GDC 2017 talk of guidelines from working AI developers on keeping behavior trees healthy: common pitfalls, debugging practice and design habits. Free to watch on the official GDC YouTube channel."
    score: 12
  - title: "Automatic difficulty management and testing in games using a framework based on behavior trees and genetic algorithms"
    url: "https://arxiv.org/abs/1909.04368"
    kind: Paper
    year: "2019"
    author: "Ciprian Paduraru and Miruna Paduraru"
    summary: "An ICECCS 2019 paper that evolves populations of behavior trees with a genetic algorithm to produce agents at different difficulty levels and to surface defects and logic exploits automatically. Uses a tank-game example with selector, sequence, parallel and decorator nodes. Read it for a concrete way to test a game with generated trees."
    score: 12
  - title: "Procedural Content Generation using Behavior Trees (PCGBT)"
    url: "https://arxiv.org/abs/2107.06638"
    kind: Paper
    year: "2021"
    author: "Anurag Sarkar and Seth Cooper"
    summary: "An EXAG 2021 paper that uses behavior trees to build level generators instead of agents: small subtrees generate parts of a level and compose into larger trees. Demonstrated on Super Mario Bros., Mega Man, Metroid and dungeon layouts. A useful look at the reuse and composition strengths of trees outside NPC control."
    score: 11
  - title: "Comparison between Behavior Trees and Finite State Machines"
    url: "https://arxiv.org/abs/2405.16137"
    kind: Paper
    year: "2024"
    author: "Matteo Iovino, Julian Forster, Pietro Falco, Jen Jen Chung, Roland Siegwart and Christian Smith"
    summary: "A preprint that compares behavior trees and finite state machines as robot control policies on a mobile manipulation task, in simulation and on a real robot. It proposes metrics for reactivity, modularity, readability and design, and finds the behavior is the same either way but a tree gets easier to maintain than a state machine as the task grows. Read it for evidence behind the usual case for trees."
    score: 13
  - title: "Nav2 Behavior Trees"
    url: "https://docs.nav2.org/rolling/getting_started/nav2_behavior_trees/"
    kind: Tool
    summary: "The Nav2 documentation page on how a production robot navigation stack uses behavior trees to orchestrate independent planner, controller and recovery servers. Shows a minimal replanning tree in XML and lists the provided trees, from point-to-point navigation to following a dynamic point. A short overview with links to a node-by-node walkthrough of the default tree."
    score: 12
  - title: "On the Implementation of Behavior Trees in Robotics"
    url: "https://arxiv.org/abs/2106.15227"
    kind: Paper
    year: "2021"
    author: "Michele Colledanchise and Lorenzo Natale"
    summary: "A paper on what changes when behavior trees leave the whiteboard and run on real robots. It compares how open-source libraries handle asynchronous actions, parameter passing and memory nodes, and shows where each fits in a robot software architecture, with a use case. Read it before choosing or writing a runtime, since the library differences decide how your tree behaves."
    score: 12
  - title: "A principled analysis of Behavior Trees and their generalisations"
    url: "https://arxiv.org/abs/2008.11906"
    kind: Paper
    year: "2020"
    author: "Oliver Biggar, Mohammad Zamani and Iman Shames"
    summary: "A formal look at why behavior trees work, built on two principles: reactiveness and modularity. It tests them against hard use cases from the literature and proposes generalised trees (k-BTs) that handle those cases while keeping the principles. Dense in places, but it explains why a tree stays easy to compose and reuse as it grows."
    score: 13
  - title: "BTGenBot: Behavior Tree Generation for Robotic Tasks with Lightweight LLMs"
    url: "https://arxiv.org/abs/2403.12761"
    kind: Paper
    year: "2024"
    author: "Riccardo Andrea Izzo, Gianluca Bardaro and Matteo Matteucci"
    summary: "Fine-tunes language models of up to 7 billion parameters to write behavior trees from a task description, using a dataset built from existing trees. It checks the output with syntax checks, a validator, a simulator and a real robot across nine tasks. Useful for seeing what machine-written trees get wrong and how validation catches it."
    score: 12
  - title: "LLM-as-BT-Planner: Leveraging LLMs for Behavior Tree Generation in Robot Task Planning"
    url: "https://arxiv.org/abs/2409.10444"
    kind: Paper
    year: "2024"
    author: "Jicong Ao, Fan Wu, Yansong Wu, Abdalla Swikir and Sami Haddadin"
    summary: "Prompts language models to produce long-horizon assembly plans directly in behavior tree format, comparing four in-context learning methods and fine-tuned smaller models in simulation and on a real robot. It shows which prompting choices raise the success rate of generated trees. Accepted at ICRA 2025."
    score: 13
  - title: "Learning of Behavior Trees for Autonomous Agents"
    url: "https://arxiv.org/abs/1504.05811"
    kind: Paper
    year: "2015"
    author: "Michele Colledanchise, Ramviyas Parasuraman and Petter Ögren"
    summary: "Evolves behavior trees with genetic programming instead of writing them by hand, and tests the result on the open-source Mario AI benchmark at several difficulty settings. It argues for trees over finite state machines because they stay modular and reactive as they grow. Published in IEEE Transactions on Games in 2019; read it to see what an automatically found tree looks like and where hand authoring still wins."
    score: 13
  - title: "Are Behavior Trees a Thing of the Past?"
    url: "https://gamedeveloper.com/programming/are-behavior-trees-a-thing-of-the-past-"
    kind: Article
    year: "2016"
    author: "Jakob Rasmussen"
    summary: "A critique of behavior trees from the utility AI side. It works one shooter example two ways, where the tree grows many branches and the utility version needs one table of about ten scorers, and it notes where utility needs tuning. The author sells a utility toolkit, so read it as an argued position, and as a good prompt for when to add scoring to a selector."
    score: 11
  - title: "Combat Evolved: The Encounter Design of Halo 3"
    url: "https://gamedeveloper.com/design/combat-evolved-the-encounter-design-of-halo-3"
    kind: Article
    year: "2018"
    author: "Tommy Thompson"
    summary: "How Halo 3 moved from scripted goals to a declarative task tree that squads claim by priority, with shared squad knowledge. Useful background for driving several agents from one tree; high level, no code."
    score: 9
  - title: "Active Inference and Behavior Trees for Reactive Action Planning and Execution in Robotics"
    url: "https://arxiv.org/abs/2011.09756"
    kind: Paper
    year: "2022"
    author: "Corrado Pezzato, Carlos Hernandez Corbato, Stefan Bonhof and Martijn Wisse"
    summary: "Adds a leaf node that names a desired state instead of an action, and lets active inference pick the actions to reach it at run time. The tree keeps the nominal plan while the leaf reacts to surprises, and the authors report far fewer hand-written nodes than a classical tree, tested in simulation and on two mobile manipulators in a retail setting. Published in IEEE Transactions on Robotics; read it for a rigorous take on goal-driven leaves and how they cut tree size."
    score: 14
  - title: "Using Behavior Trees to Create Retro Boss AI"
    url: "https://www.gamedeveloper.com/programming/using-behavior-trees-to-create-retro-boss-ai"
    kind: Article
    year: "2015"
    author: "Cody Olivier"
    summary: "A shipped-game postmortem on boss attacks in a top-down shooter. A hand-built attack branch with timer decorators was hard to change and test, so the author replaced it with a random selector over self-contained attack leaves that fail unless their conditions hold. Small, concrete and reusable across bosses; a good example of choosing a node type to keep a tree flat and testable."
    score: 12
  - title: "Behavior Trees and State Machines in Robotics Applications"
    url: "https://arxiv.org/abs/2208.04211"
    kind: Paper
    year: "2023"
    author: "Razan Ghzouli, Thorsten Berger, Einar Broch Johnsen, Andrzej Wasowski and Swaib Dragule"
    summary: "Compares behavior tree and state machine languages by analysing several DSLs in depth and mining open-source robotics projects for how each is used. The authors find the two share many language concepts and reuse patterns, and that behavior tree use is growing quickly; they release the extracted models as a dataset. Published in IEEE Transactions on Software Engineering; read it for evidence-based grounding when choosing between the two."
    score: 13
