# yaml-language-server: $schema=https://json.schemastore.org/tmuxinator.json
name: beetree
root: .
windows:
  - dev:
      layout: main-vertical
      panes:
        - dev:
          - clear
        - git status -sb
  - watch:
      layout: even-vertical
      panes:
        - dev:
          - clear
        - watchexec -e go --watch cli --restart -- task test:go
        - watchexec -e ts,css,html --watch web/src --restart -- task web:check
  - sites:
      layout: even-vertical
      panes:
        - dev:
          - clear
        - task site:dev
  - loops:
      layout: main-horizontal
      panes:
        - dev:
          - clear
        - while true; do scripts/agent-loop.sh; [ $? -eq 75 ] && break; echo "loop exited or already running; retrying in 5 min"; sleep 300; done
        - watch -n 30 task agent:loop:status
        - systemd-inhibit --what=sleep --who=beetreecraft-loop --why="overnight dev loop" sleep infinity
